<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 295" width="260" height="295" role="img" aria-label="Mamba Venture Program, Cohort 2, begins 26 January 2027">
  <!-- Mamba Venture Program cohort poster, Cohort #2 (26 Jan). Same chassis as
       the Cohort #1 "5 OCT" poster (venture-program-poster skill): two-ink print
       on cream paper, a vermilion plate with an ink outline and a solid up-right
       extrusion, the month knocked out of the top beam, and the Anton COHORT
       column stretched to the plate's height. -->
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Oswald:wght@300&amp;display=block');</style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- The plate: the slanted beam (as on the 5) over the numerals. -->
    <g id="plate">
      <path d="M34 22.5 H186 V86 H24 Z"/>
      <text x="105" y="248" text-anchor="middle" font-family="Anton, sans-serif" font-size="172" textLength="164" lengthAdjust="spacingAndGlyphs">26</text>
    </g>
  </defs>

  <rect width="260" height="295" fill="#eee8ce"/>
  <rect x="6" y="6" width="248" height="283" fill="none" stroke="#c83b2b" stroke-width="4"/>
  <rect width="260" height="295" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:multiply"/>

  <!-- Extrusion: the plate swept 9.6 units up-right in solid ink -->
  <g fill="#0b0b0c" stroke="#0b0b0c" stroke-width="1.6" stroke-linejoin="round">
    <use href="#plate" x="0.6" y="-0.6"/><use href="#plate" x="1.2" y="-1.2"/><use href="#plate" x="1.8" y="-1.8"/><use href="#plate" x="2.4" y="-2.4"/>
    <use href="#plate" x="3" y="-3"/><use href="#plate" x="3.6" y="-3.6"/><use href="#plate" x="4.2" y="-4.2"/><use href="#plate" x="4.8" y="-4.8"/>
    <use href="#plate" x="5.4" y="-5.4"/><use href="#plate" x="6" y="-6"/><use href="#plate" x="6.6" y="-6.6"/><use href="#plate" x="7.2" y="-7.2"/>
    <use href="#plate" x="7.8" y="-7.8"/><use href="#plate" x="8.4" y="-8.4"/><use href="#plate" x="9" y="-9"/><use href="#plate" x="9.6" y="-9.6"/>
  </g>
  <!-- Face: ink outline under a vermilion fill -->
  <use href="#plate" fill="#0b0b0c" stroke="#0b0b0c" stroke-width="3.2" stroke-linejoin="round"/>
  <use href="#plate" fill="#c83b2b"/>
  <!-- JAN knocked out of the beam in cream -->
  <text x="106" y="77" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="300" font-size="62" textLength="122" lengthAdjust="spacingAndGlyphs" fill="#eee8ce">JAN</text>

  <!-- COHORT#2, rotated, stretched to the plate's height -->
  <svg x="199" y="22.5" width="36" height="222" viewBox="0 0 100 600" preserveAspectRatio="none" overflow="visible">
    <text transform="translate(10 0) rotate(90)" font-family="Anton, sans-serif" font-size="100" letter-spacing="-2.5" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#c83b2b">COHORT#2</text>
  </svg>
</svg>
