<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 295" width="260" height="295" role="img" aria-label="Mamba Venture Program, Cohort 2, begins 26 January 2027">
  <!-- Mamba Venture Program cohort poster, Cohort #2 (26 Jan). Same chassis and
       construction as the Cohort #1 "5 OCT" poster (venture-program-poster skill):
       two-ink print, constructed numerals, 24-unit up-right extrusion, knocked-out
       month, Anton COHORT column stretched to the numeral band. -->
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=block');</style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- Condensed constructed digits in a 200 x 600 cell each.
         2: half-ellipse dome + 45-degree slab + base bar.
         6: a slanted stem rising to the upper right + a full elliptical bowl. -->
    <g id="two">
      <path d="M0 160 A95 160 0 0 1 190 160 Z"/>
      <path d="M95 150 H190 L95 452 H0 Z"/>
      <path d="M0 440 H190 V600 H0 Z"/>
    </g>
    <g id="six">
      <path d="M60 0 H180 L100 330 L0 420 Z"/>
      <ellipse cx="95" cy="410" rx="95" ry="190"/>
    </g>
    <g id="numerals">
      <use href="#two"/>
      <use href="#six" x="224"/>
    </g>
  </defs>

  <!-- Paper, print border, grain -->
  <rect width="260" height="295" fill="#eee8ce"/>
  <rect x="6" y="6" width="248" height="283" fill="none" stroke="#c83b2b" stroke-width="4"/>
  <rect width="260" height="295" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:multiply"/>

  <g transform="translate(17 12.8) scale(0.4)">
    <!-- Extrusion: the silhouette swept 24 units up-right, solid ink -->
    <g fill="#0b0b0c">
      <use href="#numerals" x="1.5" y="-1.5"/><use href="#numerals" x="3" y="-3"/><use href="#numerals" x="4.5" y="-4.5"/><use href="#numerals" x="6" y="-6"/><use href="#numerals" x="7.5" y="-7.5"/><use href="#numerals" x="9" y="-9"/><use href="#numerals" x="10.5" y="-10.5"/><use href="#numerals" x="12" y="-12"/><use href="#numerals" x="13.5" y="-13.5"/><use href="#numerals" x="15" y="-15"/><use href="#numerals" x="16.5" y="-16.5"/><use href="#numerals" x="18" y="-18"/><use href="#numerals" x="19.5" y="-19.5"/><use href="#numerals" x="21" y="-21"/><use href="#numerals" x="22.5" y="-22.5"/><use href="#numerals" x="24" y="-24"/>
    </g>
    <!-- Ink outline (only its outer half shows), then the vermilion face -->
    <use href="#numerals" fill="#0b0b0c" stroke="#0b0b0c" stroke-width="8" stroke-linejoin="miter"/>
    <use href="#numerals" fill="#c83b2b"/>
    <!-- JAN knocked out of the 2's base beam in cream linework, like OCT on the 5's beam -->
    <g fill="none" stroke="#eee8ce" stroke-width="10.5" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M14 466 H56 M45 466 V550 C45 572 35 582 22 582 C15 582 10 579 6 574"/>
      <path d="M60 586 L83 463 L106 586 M67.5 548 H98.5"/>
      <path d="M118 586 V464 L170 584 V462"/>
    </g>
  </g>

  <!-- COHORT#2, rotated, stretched to the numeral band -->
  <svg x="197.5" y="22.5" width="37.5" height="222.5" viewBox="0 0 100 600" preserveAspectRatio="none" overflow="visible">
    <text transform="translate(10 0) rotate(90)" font-family="Anton, sans-serif" font-size="100" letter-spacing="-2.5" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#c83b2b">COHORT#2</text>
  </svg>
</svg>
