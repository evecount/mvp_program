name: Deploy site to Firebase Hosting

# Every push to main publishes the site to https://mambaventureprogram.web.app,
# the same as running `firebase deploy --only hosting` from main. Hosting only:
# Cloud Functions and Firestore rules are still deployed by hand.
#
# Needs the FIREBASE_SERVICE_ACCOUNT repo secret: the JSON key of a service
# account in the mambaventureprogram project with the Firebase Hosting Admin role.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the service account secret is set
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repo secret (Settings → Secrets and variables → Actions) to deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mambaventureprogram
          channelId: live
